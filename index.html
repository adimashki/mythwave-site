    z-index:2;
    will-change:transform;
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.28) 12%, #000 34%, #000 100%);
            mask-image:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.28) 12%, #000 34%, #000 100%);
  }
  /* moonlight riding the water */
  .scene::after{
    content:""; position:absolute; left:-10%; right:-10%; bottom:0; height:50%;
    background:repeating-linear-gradient(to right,
      rgba(160,205,255,0) 0px, rgba(160,205,255,.05) 70px, rgba(160,205,255,0) 150px);
    animation:drift 26s linear infinite;
    -webkit-mask-image:linear-gradient(180deg, transparent, #000 60%);
            mask-image:linear-gradient(180deg, transparent, #000 60%);
  }
  @keyframes drift{ from{transform:translateX(0)} to{transform:translateX(-150px)} }

  /* horizon haze */
  .haze{
    position:absolute; left:0; right:0; bottom:26%; height:32%;
    background:radial-gradient(58% 100% at 50% 100%, rgba(48,112,208,.18), transparent 72%);
    filter:blur(34px); z-index:3; pointer-events:none;
  }

  /* ---------- Content ---------- */
  .content{
    position:relative; z-index:4;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:0 24px;
    margin-bottom:16vh;
    will-change:transform;
  }
  /* soft cinematic scrim so type stays legible over the water */
  .content::before{
    content:""; position:absolute;
    left:50%; top:50%; transform:translate(-50%,-50%);
    width:150%; height:150%;
    background:radial-gradient(ellipse at center, rgba(3,8,20,.62) 0%, rgba(3,8,20,.34) 42%, transparent 70%);
    filter:blur(20px); z-index:-1; pointer-events:none;
  }

  .logo-wrap{ position:relative; display:block; }
  .logo-wrap::before{
    content:""; position:absolute; left:50%; top:36%;
    width:58%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(70,145,255,.34) 0%, rgba(60,130,240,.11) 45%, transparent 70%);
    filter:blur(30px);
    animation:breathe 7.5s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes breathe{
    0%,100%{opacity:.5;  transform:translate(-50%,-50%) scale(.92)}
    50%    {opacity:.95; transform:translate(-50%,-50%) scale(1.08)}
  }

  .logo{
    position:relative; display:block;
    width:min(560px, 82vw); height:auto;
    filter:drop-shadow(0 6px 30px rgba(4,10,24,.85));
  }

  /* ---------- Coming soon ---------- */
  .soon{
    position:relative; margin-top:26px;
    font-size:clamp(15px, 2.3vw, 25px); font-weight:600;
    letter-spacing:.52em; text-indent:.52em;
    background:linear-gradient(100deg,#8fb6e8 0%,#ffffff 42%,#c4dcff 52%,#8fb6e8 100%);
    background-size:260% 100%;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:sweep 8s ease-in-out infinite;
    filter:drop-shadow(0 2px 10px rgba(2,6,16,.95));
  }
  @keyframes sweep{ 0%,100%{background-position:130% 0} 50%{background-position:-30% 0} }

  .rule{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin-top:22px; width:min(420px, 72vw);
  }
  .rule i{ flex:1; height:1px; background:linear-gradient(90deg, transparent, rgba(165,205,255,.5), transparent); }
  .rule b{
    width:7px; height:7px; transform:rotate(45deg);
    background:#7fb2ff; box-shadow:0 0 12px rgba(127,178,255,.9);
    animation:breathe 7.5s ease-in-out infinite;
  }

  .sub{
    margin-top:18px; max-width:34ch;
    font-size:clamp(12.5px, 1.5vw, 16px); font-weight:400;
    line-height:1.9; letter-spacing:.16em;
    color:rgba(205,224,250,.8);
    text-shadow:0 2px 12px rgba(2,6,16,.95);
  }

  /* ---------- Footer ---------- */
  .foot{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:0 20px calc(20px + env(safe-area-inset-bottom));
    text-align:center; font-size:11px; letter-spacing:.2em;
    color:rgba(160,190,228,.48);
    text-shadow:0 1px 8px rgba(2,6,16,.9);
  }

  /* ---------- Entrance ---------- */
  .rise{ opacity:0; transform:translateY(18px); animation:rise 1.5s cubic-bezier(.22,.8,.28,1) forwards; }
  @keyframes rise{ to{opacity:1; transform:none} }
  .d1{animation-delay:.2s} .d2{animation-delay:.9s} .d3{animation-delay:1.15s}
  .d4{animation-delay:1.4s} .d5{animation-delay:1.8s}

  /* ---------- Responsive ---------- */
  @media (max-width:640px){
    .scene{height:56%}
    .content{margin-bottom:18vh}
    .logo{width:86vw}
    .soon{margin-top:20px; letter-spacing:.4em; text-indent:.4em}
    .rule{margin-top:18px}
    .sub{margin-top:14px; letter-spacing:.12em}
  }
  @media (max-height:560px) and (orientation:landscape){
    .scene{height:74%}
    .content{margin-bottom:6vh}
    .logo{width:min(340px,42vw)}
    .sub,.rule{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important; transition:none !important}
    .rise{opacity:1; transform:none}
  }
</style>
</head>

    <div class="rule rise d3" aria-hidden="true"><i></i><b></b><i></i></div>

    <p class="sub rise d4">An epic new mobile adventure is rising over the horizon.</p>

</div>

<script>
(function () {
  document.getElementById('yr').textContent = new Date().getFullYear();
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------- Stars + sea motes ---------------- */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var W = 0, H = 0, stars = [], motes = [];

  function newMote(seed) {
    return {
      x: Math.random() * W,
      y: seed ? Math.random() * H : H + Math.random() * 60,
      r: Math.random() * 1.7 + 0.5,
      v: Math.random() * 0.28 + 0.09,
      sw: Math.random() * 0.7 + 0.2,
      ph: Math.random() * Math.PI * 2,
      a: Math.random() * 0.45 + 0.15
    };
  }

  function build() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var area = W * H;
    stars = [];
    for (var i = 0, n = Math.min(190, Math.round(area / 8500)); i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H * 0.58,
        r: Math.random() * 1.1 + 0.25,
        a: Math.random() * 0.5 + 0.12,
        tw: Math.random() * 0.9 + 0.25,
        ph: Math.random() * Math.PI * 2
      });
    }
    motes = [];
    for (var j = 0, m = Math.min(70, Math.round(area / 26000)); j < m; j++) motes.push(newMote(true));
  }

  function drawStars(t) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var al = t === null ? s.a : s.a * (0.55 + 0.45 * Math.sin(t * s.tw + s.ph));
      var fade = s.y > H * 0.42 ? Math.max(0, 1 - (s.y - H * 0.42) / (H * 0.18)) : 1;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fillStyle = 'rgba(214,232,255,' + (al * fade).toFixed(3) + ')';
      ctx.fill();
    }
  }

  var t = 0;
  function frame() {
    t += 0.016;
    ctx.clearRect(0, 0, W, H);
    drawStars(t);
    for (var k = 0; k < motes.length; k++) {
      var m = motes[k];
      m.y -= m.v;
      m.x += Math.sin(t * m.sw + m.ph) * 0.22;
      if (m.y < -20) { motes[k] = newMote(false); continue; }
      var fade = m.y < H * 0.18 ? Math.max(0, m.y / (H * 0.18)) : 1;
      var al = m.a * fade * (0.6 + 0.4 * Math.sin(t * 1.6 + m.ph));
      var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 5);
      g.addColorStop(0, 'rgba(175,212,255,' + al.toFixed(3) + ')');
      g.addColorStop(1, 'rgba(90,150,255,0)');
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r * 5, 0, 6.2832);
      ctx.fillStyle = g; ctx.fill();
    }
    requestAnimationFrame(frame);
  }

  build();
  window.addEventListener('resize', function () { build(); if (reduce) { ctx.clearRect(0, 0, W, H); drawStars(null); } });
  if (reduce) drawStars(null); else frame();

  /* ---------------- Parallax ---------------- */
  if (!reduce) {
    var scene = document.getElementById('scene');
    var content = document.getElementById('content');
    var tx = 0, ty = 0, cx = 0, cy = 0;

    (function loop() {
      cx += (tx - cx) * 0.06;
      cy += (ty - cy) * 0.06;
      scene.style.transform   = 'translate3d(' + (cx * 18).toFixed(2) + 'px,' + (cy * 9).toFixed(2) + 'px,0) scale(1.05)';
      content.style.transform = 'translate3d(' + (cx * -10).toFixed(2) + 'px,' + (cy * -5).toFixed(2) + 'px,0)';
      requestAnimationFrame(loop);
    })();

    window.addEventListener('mousemove', function (e) {
      tx = (e.clientX / window.innerWidth) * 2 - 1;
      ty = (e.clientY / window.innerHeight) * 2 - 1;
    }, { passive: true });

    window.addEventListener('deviceorientation', function (e) {
      if (e.gamma == null) return;
      tx = Math.max(-1, Math.min(1, e.gamma / 34));
      ty = Math.max(-1, Math.min(1, ((e.beta == null ? 45 : e.beta) - 45) / 34));
    }, { passive: true });
  }
})();
</script>
