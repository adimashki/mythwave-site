<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Myth Waves Studios — Coming Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Work+Sans:wght@300;400;500&display=swap');

  :root{
    --abyss: #0a1220;
    --deep: #0f1c30;
    --mid: #16283f;
    --foam: #e8edf5;
    --muted: #7c8aa3;
    --tide: #4dd8c9;
    --myth: #9b8cf2;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: var(--abyss);
    color: var(--foam);
    font-family: 'Work Sans', sans-serif;
    overflow: hidden;
  }

  body{
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }

  /* ambient depth gradient */
  .depth{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(155,140,242,0.10), transparent 60%),
      radial-gradient(ellipse 100% 60% at 50% 110%, rgba(77,216,201,0.10), transparent 60%);
    pointer-events:none;
  }

  /* wave layers */
  .waves{
    position:absolute;
    bottom:0; left:0; width:100%;
    height:55vh;
    overflow:hidden;
    pointer-events:none;
  }
  .waves svg{
    position:absolute;
    bottom:0; left:0;
    width:200%;
    height:100%;
  }
  .wave-1{ animation: drift 26s linear infinite; opacity:0.55; }
  .wave-2{ animation: drift 40s linear infinite reverse; opacity:0.35; }
  .wave-3{ animation: drift 60s linear infinite; opacity:0.22; }

  @keyframes drift{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  /* content */
  .content{
    position:relative;
    z-index:2;
    text-align:center;
    padding: 0 24px;
    max-width: 640px;
  }

  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--tide);
    margin-bottom: 28px;
    font-weight: 500;
    opacity: 0;
    animation: rise 1s ease-out 0.2s forwards;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2.6rem, 7vw, 5rem);
    line-height: 1.05;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, var(--foam) 40%, var(--tide) 85%, var(--myth) 110%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: rise 1.1s ease-out 0.4s forwards;
  }

  .tagline{
    margin-top: 22px;
    font-size: 16px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.02em;
    opacity: 0;
    animation: rise 1s ease-out 0.7s forwards;
  }

  .status{
    margin-top: 56px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: rise 1s ease-out 1s forwards;
  }

  .status .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--tide);
    box-shadow: 0 0 0 0 rgba(77,216,201,0.6);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(77,216,201,0.5); }
    70%{ box-shadow: 0 0 0 8px rgba(77,216,201,0); }
    100%{ box-shadow: 0 0 0 0 rgba(77,216,201,0); }
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  footer{
    position: absolute;
    bottom: 28px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
    z-index: 2;
    opacity: 0;
    animation: rise 1s ease-out 1.3s forwards;
  }

  footer a{
    color: var(--muted);
    text-decoration: none;
    border-bottom: 1px solid rgba(124,138,163,0.35);
    transition: color 0.2s, border-color 0.2s;
  }
  footer a:hover{
    color: var(--tide);
    border-color: var(--tide);
  }

  @media (prefers-reduced-motion: reduce){
    .wave-1, .wave-2, .wave-3, .status .dot { animation: none; }
    h1, .tagline, .eyebrow, .status, footer{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="depth"></div>

  <div class="waves">
    <svg class="wave-1" viewBox="0 0 2400 300" preserveAspectRatio="none">
      <path d="M0,150 C200,90 400,210 600,150 C800,90 1000,210 1200,150 C1400,90 1600,210 1800,150 C2000,90 2200,210 2400,150 L2400,300 L0,300 Z" fill="var(--tide)"/>
    </svg>
    <svg class="wave-2" viewBox="0 0 2400 300" preserveAspectRatio="none">
      <path d="M0,180 C300,120 500,230 800,170 C1100,110 1300,230 1600,170 C1900,110 2100,230 2400,170 L2400,300 L0,300 Z" fill="var(--myth)"/>
    </svg>
    <svg class="wave-3" viewBox="0 0 2400 300" preserveAspectRatio="none">
      <path d="M0,210 C250,160 450,250 700,200 C950,150 1150,250 1400,200 C1650,150 1850,250 2400,200 L2400,300 L0,300 Z" fill="var(--foam)"/>
    </svg>
  </div>

  <div class="content">
    <div class="eyebrow">Myth Waves Studios</div>
    <h1>Something is stirring beneath the surface</h1>
    <p class="tagline">A new world is taking shape. We'll surface when it's ready.</p>
    <div class="status"><span class="dot"></span>In development</div>
  </div>

  <footer>
    <a href="mailto:admin@mythwave.com">admin@mythwave.com</a>
  </footer>

</body>
</html>
